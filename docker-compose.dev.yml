services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    command: npm run dev:docker
    environment:
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
o    command: npm run dev:docker
    # The anonymous node_modules volume is seeded from the image, but Compose
    # reuses an existing volume when recreating the container. A volume created
    # before the dev stage existed holds production dependencies only, so
    # nodemon would still be missing — reinstall in that case.
    command:
      - sh
      - -c
      - |
        if [ ! -x node_modules/.bin/nodemon ]; then
          echo "dev dependencies missing from node_modules volume - running npm ci"
          npm ci || exit 1
        fi
        exec npm run dev:docker
    environment:
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=500
      - STORAGE_BACKEND=ipfs
      - IPFS_API_URL=http://ipfs:5001
    volumes:
      - ./backend/src:/app/src
      - ./backend/package.json:/app/package.json:ro
      - ./backend/package-lock.json:/app/package-lock.json:ro
      - /app/node_modules
    depends_on:
      - ipfs

  ipfs:
    image: ipfs/kubo:v0.28.0
    ports:
      - '5001:5001'
      - '8080:8080'
    volumes:
      - ipfs_data:/data/ipfs

volumes:
  ipfs_data:
